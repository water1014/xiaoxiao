name: 打包网页为APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 安装打包工具
        run: npm install -g cordova

      - name: 创建安卓壳子
        # 应用显示名用「笑笑养成记」；包名 com.xiaoxiao.workbench 可自行改成你的
        run: cordova create app com.xiaoxiao.workbench "笑笑养成记"

      - name: 设置自定义图标
        run: |
          cd app
          if [ -f ../icon.png ]; then
            cp ../icon-512.png icon.png
            sed -i '/<\/widget>/i \ \ <icon src="icon.png" />' config.xml
            echo "✅ 已使用 icon.png 作为图标"
          else
            echo "⚠️ 未找到 icon.png，使用默认图标"
          fi

      - name: 复制网页文件到壳子
        run: |
          cd app
          rm -rf www/*
          rsync -av --exclude='app' --exclude='.git' --exclude='.github' --exclude='*.zip' --exclude='archive' ../ www/
          echo "✅ 检查 index.html 是否存在："
          ls www/

      - name: 添加安卓平台
        run: |
          cd app
          cordova platform add android

      - name: 构建APK
        run: |
          cd app
          cordova build android

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: 笑笑养成记-安装包
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
